<style>
/* Layout: single reading column (max 72rem) of report sections; wide tables scroll in their own box. */
:root{
  --bg:#f6f7f8; --surface:#ffffff; --fg:#1b2329; --muted:#5b6770; --line:#d5dbe0;
  --accent:#1f5f8b; --pass:#1e7b4a; --fail:#b3261e; --code:#eceff2;
  --f-head:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171b; --surface:#1a2127; --fg:#e3e8ec; --muted:#9aa7b1; --line:#2e3943;
  --accent:#7fb6dd; --pass:#5fc28d; --fail:#f08a80; --code:#232c33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171b; --surface:#1a2127; --fg:#e3e8ec; --muted:#9aa7b1; --line:#2e3943;
  --accent:#7fb6dd; --pass:#5fc28d; --fail:#f08a80; --code:#232c33; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
main{max-width:72rem;margin:0 auto;display:flex;flex-direction:column;gap:10px}
main>*{min-width:0}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;line-height:1.3;margin:0}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.2rem;font-weight:600;margin-top:22px;padding-bottom:4px;border-bottom:1px solid var(--line);color:var(--accent)}
h3{font-size:1.02rem;font-weight:600;margin-top:12px}
p{margin:0;max-width:75ch}
code{font-family:var(--f-data);font-size:.86em;background:var(--code);padding:1px 4px;border-radius:3px;overflow-wrap:anywhere}
pre{font-family:var(--f-data);font-size:.85em;background:var(--code);padding:10px 12px;border-radius:4px;overflow-x:auto;margin:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.83rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.76rem;letter-spacing:.03em}
td.pass{color:var(--pass);font-weight:600} td.fail{color:var(--fail);font-weight:600}
figure{margin:6px 0;display:flex;flex-direction:column;gap:6px}
figure img{max-width:100%;background:#ffffff;border:1px solid var(--line);border-radius:4px;padding:6px}
figcaption{font-size:.82rem;color:var(--muted)}
.note{border-left:3px solid var(--accent);background:var(--surface);padding:10px 14px;border-radius:0 4px 4px 0;display:flex;flex-direction:column;gap:6px}
.warn{border-left-color:var(--fail)}
.rev{color:var(--accent);font-weight:600}
ol.flow{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px;max-width:75ch}
</style>
